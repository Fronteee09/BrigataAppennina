<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Annunci Ufficiali - Brigata Appennina ★</title>
    <link rel="icon" type="image/png" href="sfondoba.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            background-color: #0b1a0e;
            position: relative;
            padding: 20px;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('sfondoba.png');
            background-size: cover;
            background-position: center;
            filter: blur(8px) opacity(0.3);
            transform: scale(1.05);
            z-index: -1;
        }

        header {
            background: rgba(15, 35, 20, 0.9);
            border-bottom: 2px solid #008c45;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-radius: 12px;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }

        header h1 {
            font-size: 1.4em;
            color: #ffffff;
        }

        .back-btn {
            background-color: #008c45;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #00b359;
        }

        .main-container {
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
        }

        /* Pannello creazione post riservato all'admin */
        #admin-post-form {
            background: rgba(15, 35, 20, 0.9);
            border: 2px solid #cd212a;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 25px;
            display: none; /* Nascosto di default, appare se loggato come admin */
            backdrop-filter: blur(5px);
        }

        #admin-post-form h2 {
            font-size: 1.2em;
            color: #cd212a;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 12px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.85em;
            color: #d1d5db;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #008c45;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 0.95em;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #00b359;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border: none;
            background-color: #008c45;
            color: white;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #00b359;
        }

        /* Stile delle schede annunci */
        .annuncio-card {
            background: rgba(15, 35, 20, 0.85);
            border: 2px solid #008c45;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
        }

        .annuncio-title {
            font-size: 1.3em;
            color: #00b359;
            margin-bottom: 8px;
        }

        .annuncio-meta {
            font-size: 0.8em;
            color: #9ca3af;
            margin-bottom: 12px;
            border-bottom: 1px dashed #008c45;
            padding-bottom: 5px;
        }

        .annuncio-body {
            font-size: 0.95em;
            line-height: 1.5;
            color: #e5e7eb;
            margin-bottom: 15px;
            white-space: pre-wrap;
        }

        .annuncio-img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            border: 1px solid #ffffff;
            margin-top: 10px;
            display: block;
        }

        .no-annunci {
            text-align: center;
            color: #9ca3af;
            margin-top: 40px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="main-container">
        <header>
            <h1>📢 Bollettini e Annunci</h1>
            <a href="index.html" class="back-btn">← Home</a>
        </header>

        <!-- FORM CREAZIONE ANNUNCI (Visibile solo all'Admin) -->
        <div id="admin-post-form">
            <h2>★ Crea Nuovo Annuncio Ufficiale</h2>
            <div class="form-group">
                <label for="post-title">Titolo dell'Annuncio</label>
                <input type="text" id="post-title" placeholder="Es. Mobilitazione Generale...">
            </div>
            <div class="form-group">
                <label for="post-body">Corpo del Messaggio</label>
                <textarea id="post-body" rows="4" placeholder="Scrivi il testo del bollettino..."></textarea>
            </div>
            <div class="form-group">
                <label for="post-img">URL Immagine (Opzionale)</label>
                <input type="url" id="post-img" placeholder="https://esempio.com/immagine.png">
            </div>
            <button class="btn" id="btn-pubblica">Dirama Comunicato</button>
        </div>

        <!-- LISTA DEGLI ANNUNCI -->
        <div id="feed-annunci">
            <p class="no-annunci">Caricamento bollettini in corso...</p>
        </div>
    </div>

    <!-- SDK Firebase JS v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            getDocs, 
            query, 
            orderBy, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD5qGXb79oKl2hlo2NuetFuJYQGJvUKggI",
            authDomain: "brigataappennina.firebaseapp.com",
            projectId: "brigataappennina",
            storageBucket: "brigataappennina.firebasestorage.app",
            messagingSenderId: "122974690609",
            appId: "1:122974690609:web:8ab3b6c074e7200155a410",
            measurementId: "G-2CNSSGXSYG"
        };

        const ADMIN_UID = "IgYHEzKH62TIZXmsTeREuVB5UMe2"; // Il tuo UID

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        const adminPostForm = document.getElementById('admin-post-form');
        const feedAnnunci = document.getElementById('feed-annunci');
        const btnPubblica = document.getElementById('btn-pubblica');

        // Controllo autenticazione per mostrare o meno il form di creazione
        onAuthStateChanged(auth, (user) => {
            if (user && user.uid === ADMIN_UID) {
                adminPostForm.style.display = 'block';
            } else {
                adminPostForm.style.display = 'none';
            }
        });

        // Pubblicazione nuovo annuncio
        btnPubblica.addEventListener('click', async () => {
            const titolo = document.getElementById('post-title').value.trim();
            const corpo = document.getElementById('post-body').value.trim();
            const immagine = document.getElementById('post-img').value.trim();

            if (!titolo || !corpo) {
                alert("Inserisci almeno un titolo e il corpo del messaggio!");
                return;
            }

            try {
                await addDoc(collection(db, "annunci"), {
                    titolo: titolo,
                    corpo: corpo,
                    immagine: immagine || "",
                    autore: auth.currentUser.displayName || "Fronte ★",
                    timestamp: serverTimestamp()
                });

                alert("Annuncio diramato con successo!");
                document.getElementById('post-title').value = "";
                document.getElementById('post-body').value = "";
                document.getElementById('post-img').value = "";
                
                caricaAnnunci(); // Ricarica la lista
            } catch (error) {
                alert("Errore nella pubblicazione: " + error.message);
            }
        });

        // Caricamento e visualizzazione degli annunci da Firestore
        async function caricaAnnunci() {
            feedAnnunci.innerHTML = '<p class="no-annunci">Caricamento bollettini in corso...</p>';
            try {
                const q = query(collection(db, "annunci"), orderBy("timestamp", "desc"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    feedAnnunci.innerHTML = '<p class="no-annunci">Nessun annuncio ufficiale al momento.</p>';
                    return;
                }

                feedAnnunci.innerHTML = "";
                querySnapshot.forEach((docSnap) => {
                    const data = docSnap.data();
                    
                    // Formattazione data se disponibile
                    let dataStr = "Data recente";
                    if (data.timestamp && data.timestamp.toDate) {
                        dataStr = data.timestamp.toDate().toLocaleString('it-IT', { 
                            day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' 
                        });
                    }

                    // Costruisce la card dell'annuncio
                    const card = document.createElement('div');
                    card.className = 'annuncio-card';
                    
                    let htmlContent = `
                        <div class="annuncio-title">★ ${escapeHtml(data.titolo)}</div>
                        <div class="annuncio-meta">Diramato da: <strong>${escapeHtml(data.autore || "Fronte ★")}</strong> il ${dataStr}</div>
                        <div class="annuncio-body">${escapeHtml(data.corpo)}</div>
                    `;

                    if (data.immagine) {
                        htmlContent += `<img src="${escapeHtml(data.immagine)}" alt="Immagine Annuncio" class="annuncio-img" onerror="this.style.display='none'">`;
                    }

                    card.innerHTML = htmlContent;
                    feedAnnunci.appendChild(card);
                });
            } catch (error) {
                feedAnnunci.innerHTML = '<p class="no-annunci">Errore nel caricamento degli annunci (assicurati di aver configurato le Firestore Rules corrette).</p>';
                console.error(error);
            }
        }

        // Funzione di sicurezza base per evitare problemi di script nei testi
        function escapeHtml(text) {
            if (!text) return "";
            return text
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        // Avvia il caricamento all'apertura della pagina
        caricaAnnunci();
    </script>
</body>
</html>
