<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Account - Brigata Appennina ★</title>
    <link rel="icon" type="image/png" href="sfondoba.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            background-color: #0b1a0e;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('sfondoba.png');
            background-size: cover;
            background-position: center;
            filter: blur(8px) opacity(0.3);
            transform: scale(1.05);
            z-index: -1;
        }

        .card-container {
            background: rgba(15, 35, 20, 0.85);
            border: 2px solid #008c45;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 440px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        h1 {
            font-size: 1.8em;
            margin-bottom: 20px;
            color: #ffffff;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #d1d5db;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #008c45;
            background-color: rgba(0, 0, 0, 0.5);
            color: #fff;
            font-size: 1em;
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #00b359;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s;
            border: none;
        }

        .btn-primary {
            background-color: #008c45;
            color: #ffffff;
        }

        .btn-primary:hover {
            background-color: #00b359;
        }

        .btn-danger {
            background-color: #cd212a;
            color: white;
        }

        .toggle-text {
            margin-top: 15px;
            font-size: 0.85em;
            color: #9ca3af;
            cursor: pointer;
            text-decoration: underline;
        }

        #user-info {
            display: none;
        }

        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 2px solid #008c45;
        }

        .admin-badge {
            display: inline-block;
            background-color: #cd212a;
            color: white;
            font-size: 0.8em;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 12px;
            margin-top: 5px;
            margin-bottom: 15px;
            letter-spacing: 0.5px;
        }

        .admin-panel {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px dashed #008c45;
            text-align: left;
        }

        .admin-panel h3 {
            color: #00b359;
            font-size: 1.1em;
            margin-bottom: 10px;
            text-align: center;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #d1d5db;
            text-decoration: none;
            font-size: 0.9em;
        }

        .back-link:hover {
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="card-container">
        
        <!-- FORM ACCESSO / REGISTRAZIONE -->
        <div id="auth-container">
            <h1 id="form-title">Accedi alla Brigata</h1>
            
            <div class="form-group">
                <label for="username">Nickname Recluta</label>
                <input type="text" id="username" placeholder="Garibaldi1861" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" placeholder="••••••••" required>
            </div>

            <button class="btn btn-primary" id="btn-auth">Accedi</button>

            <p class="toggle-text" id="toggle-auth">Non hai un account? Registrati qui.</p>
        </div>

        <!-- SCHERMATA PROFILO UTENTE LOGGATO -->
        <div id="user-info">
            <h1>Profilo Recluta ★</h1>
            <img id="user-photo" class="user-avatar" src="sfondoba.png" alt="Avatar">
            <p style="font-size: 1.2em;"><strong id="user-name">Nickname</strong></p>
            
            <!-- Badge visibile solo se Admin -->
            <div id="admin-badge" class="admin-badge" style="display: none;">★ COMANDANTE SUPREMO (ADMIN)</div>
            
            <!-- PANNELLO COMANDO ADMIN -->
            <div id="admin-panel" class="admin-panel">
                <h3>Pannello di Comando</h3>
                
                <div class="form-group">
                    <label for="annuncio-text">Nuovo Annuncio della Brigata</label>
                    <textarea id="annuncio-text" rows="3" placeholder="Scrivi un annuncio ufficiale..."></textarea>
                    <button class="btn btn-primary" id="btn-pubblica-annuncio">Pubblica Annuncio</button>
                </div>

                <div class="form-group" style="margin-top: 15px;">
                    <label for="block-uid">Blocca Utente (Inserisci UID o Nickname)</label>
                    <input type="text" id="block-uid" placeholder="UID o Nome Utente">
                    <button class="btn btn-danger" id="btn-blocca-utente">Blocca Utente</button>
                </div>
            </div>

            <button class="btn btn-danger" id="btn-logout" style="margin-top: 20px;">Disconnetti</button>
        </div>

        <a href="index.html" class="back-link">← Torna alla Home</a>
    </div>

    <!-- SDK Firebase JS v10 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            createUserWithEmailAndPassword, 
            updateProfile,
            signOut, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { 
            getFirestore, 
            collection, 
            addDoc, 
            setDoc, 
            doc, 
            serverTimestamp 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Configurazione Firebase
        const firebaseConfig = {
            apiKey: "AIzaSyD5qGXb79oKl2hlo2NuetFuJYQGJvUKggI",
            authDomain: "brigataappennina.firebaseapp.com",
            projectId: "brigataappennina",
            storageBucket: "brigataappennina.firebasestorage.app",
            messagingSenderId: "122974690609",
            appId: "1:122974690609:web:8ab3b6c074e7200155a410",
            measurementId: "G-2CNSSGXSYG"
        };

        const ADMIN_UID = "IgYHEzKH62TIZXmsTeREuVB5UMe2"; // UID di Fronte ★

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let isLogin = true;

        const authContainer = document.getElementById('auth-container');
        const userInfo = document.getElementById('user-info');
        const usernameInput = document.getElementById('username');
        const passwordInput = document.getElementById('password');
        const btnAuth = document.getElementById('btn-auth');
        const btnLogout = document.getElementById('btn-logout');
        const toggleAuth = document.getElementById('toggle-auth');
        const formTitle = document.getElementById('form-title');

        const adminBadge = document.getElementById('admin-badge');
        const adminPanel = document.getElementById('admin-panel');
        const btnPubblicaAnnuncio = document.getElementById('btn-pubblica-annuncio');
        const btnBloccaUtente = document.getElementById('btn-blocca-utente');

        // Switch tra Login e Registrazione
        toggleAuth.addEventListener('click', () => {
            isLogin = !isLogin;
            formTitle.textContent = isLogin ? "Accedi alla Brigata" : "Registra Nuova Recluta";
            btnAuth.textContent = isLogin ? "Accedi" : "Registrati";
            toggleAuth.textContent = isLogin ? "Non hai un account? Registrati qui." : "Hai già un account? Accedi.";
        });

        function getInternalEmail(username) {
            const cleanUser = username.trim().toLowerCase().replace(/[^a-z0-9]/g, "");
            const finalUser = cleanUser.length > 0 ? cleanUser : "user" + Date.now();
            return `${finalUser}@brigataappennina.com`;
        }

        // Login / Registrazione
        btnAuth.addEventListener('click', async () => {
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            if (!username || !password) {
                alert("Compila sia il Nickname che la Password!");
                return;
            }

            const fakeEmail = getInternalEmail(username);

            try {
                if (isLogin) {
                    await signInWithEmailAndPassword(auth, fakeEmail, password);
                } else {
                    const userCredential = await createUserWithEmailAndPassword(auth, fakeEmail, password);
                    await updateProfile(userCredential.user, {
                        displayName: username
                    });
                    window.location.reload();
                }
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    alert("Questo nickname è già stato preso da un'altra recluta!");
                } else if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password') {
                    alert("Nickname o password errati.");
                } else if (error.code === 'auth/weak-password') {
                    alert("La password deve contenere almeno 6 caratteri.");
                } else {
                    alert("Errore: " + error.message);
                }
            }
        });

        // Azioni Admin: Pubblica Annuncio
        btnPubblicaAnnuncio.addEventListener('click', async () => {
            const testo = document.getElementById('annuncio-text').value.trim();
            if (!testo) return alert("Scrivi prima il testo dell'annuncio!");

            try {
                await addDoc(collection(db, "annunci"), {
                    testo: testo,
                    autore: auth.currentUser.displayName || "Fronte ★",
                    timestamp: serverTimestamp()
                });
                alert("Annuncio pubblicato con successo!");
                document.getElementById('annuncio-text').value = "";
            } catch (error) {
                alert("Errore nella pubblicazione: " + error.message);
            }
        });

        // Azioni Admin: Blocca Utente
        btnBloccaUtente.addEventListener('click', async () => {
            const target = document.getElementById('block-uid').value.trim();
            if (!target) return alert("Inserisci l'UID o il Nickname dell'utente da bloccare!");

            try {
                await setDoc(doc(db, "blocked_users", target), {
                    blockedAt: serverTimestamp(),
                    blockedBy: auth.currentUser.uid
                });
                alert(`Utente ${target} inserito nella lista dei bloccati!`);
                document.getElementById('block-uid').value = "";
            } catch (error) {
                alert("Errore nel blocco dell'utente: " + error.message);
            }
        });

        // Logout
        btnLogout.addEventListener('click', () => signOut(auth));

        // Controllo Stato Autenticazione e Ruolo Admin
        onAuthStateChanged(auth, (user) => {
            if (user) {
                authContainer.style.display = 'none';
                userInfo.style.display = 'block';
                document.getElementById('user-name').textContent = user.displayName || usernameInput.value;

                // Verifica se l'utente loggato è l'Admin tramite UID
                if (user.uid === ADMIN_UID) {
                    adminBadge.style.display = 'inline-block';
                    adminPanel.style.display = 'block';
                } else {
                    adminBadge.style.display = 'none';
                    adminPanel.style.display = 'none';
                }
            } else {
                authContainer.style.display = 'block';
                userInfo.style.display = 'none';
                adminBadge.style.display = 'none';
                adminPanel.style.display = 'none';
            }
        });
    </script>
</body>
</html>
