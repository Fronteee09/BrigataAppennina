                                <label style="font-size: 0.75em; color: #d1d5db;">Numero Unità Personali:</label>
                                <input type="number" id="num-unita-${regione.id}" value="1" min="1" style="width: 100%; padding: 4px; background: rgba(0,0,0,0.6); color: #fff; border: 1px solid #008c45; border-radius: 4px; font-size: 0.8em; margin-bottom: 6px;">
                                <button class="btn-mobilitati" onclick="mobilitatiIn('${regione.id}', '${regione.nome}')">🎯 Dislocati Qui</button>
                                <button class="btn-rimuovi" onclick="rimuoviUnita('${regione.id}')">🗑️ Ritira le mie truppe</button>
                            </div>
                        `;
                    }
                } else {
                    formMobilitazione = `<p style="font-size: 0.75em; color: #9ca3af; margin-top: 5px;">Accedi per dislocare unità in questo settore.</p>`;
                }

                const popupHtml = `
                    <div>
                        <div class="popup-title">${regione.nome}</div>
                        <div class="popup-desc">${regione.descrizione}</div>
                        <div class="popup-images">${immaginiHtml}</div>
                        
                        <div class="mobilitazione-box">
                            <div style="font-size: 0.9em; font-weight: bold; margin-bottom: 4px;">Totale Unità: <span id="count-total-${regione.id}" class="units-badge">0</span></div>
                            
                            <div style="font-size: 0.75em; text-align: left; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 6px; margin-bottom: 6px;">
                                <div>🛡️ Appennini: <strong id="count-appennini-${regione.id}">0</strong></div>
                                <div>🌲 Carabinieri: <strong id="count-carabinieri-${regione.id}">0</strong></div>
                                <div>🎖️ Fanteria: <strong id="count-fanteria-${regione.id}">0</strong></div>
                                <div>⚓ Guardia Costiera: <strong id="count-costiera-${regione.id}">0</strong></div>
                                <div>🕵️ Intelligence: <strong id="count-intelligence-${regione.id}">0</strong></div>
                                <div>🛡️ Antisommossa: <strong id="count-antisommossa-${regione.id}">0</strong></div>
                                <div>⚔️ Forze Speciali: <strong id="count-speciali-${regione.id}">0</strong></div>
                            </div>

                            <div id="admin-list-${regione.id}"></div>
                            ${formMobilitazione}
                        </div>
                    </div>
                `;

                marker.bindPopup(popupHtml).openPopup();

                const q = query(collection(db, "mobilitazioni"), where("luogoId", "==", regione.id));
                onSnapshot(q, (snapshot) => {
                    let totalUnita = 0;
                    let appenniniCount = 0;
                    let carabinieriCount = 0;
                    let fanteriaCount = 0;
                    let costieraCount = 0;
                    let intelligenceCount = 0;
                    let antisommossaCount = 0;
                    let specialiCount = 0;
                    let listaAdminHtml = "";

                    snapshot.forEach(docSnap => {
                        const data = docSnap.data();
                        const unita = parseInt(data.unita || 1);
                        const reparto = data.reparto || "Guardia Appennina";

                        totalUnita += unita;

                        if (reparto === "Guardia Appennina") appenniniCount += unita;
                        else if (reparto === "Carabinieri Forestali") carabinieriCount += unita;
                        else if (reparto === "Esercito Fanteria") fanteriaCount += unita;
                        else if (reparto === "Guardia Costiera") costieraCount += unita;
                        else if (reparto === "Intelligence") intelligenceCount += unita;
                        else if (reparto === "Antisommossa") antisommossaCount += unita;
                        else if (reparto === "Forze Speciali") specialiCount += unita;

                        listaAdminHtml += `• ${data.nickname || "Anonimo"} (${reparto}: ${unita})<br>`;
                    });

                    const totalElem = document.getElementById(`count-total-${regione.id}`);
                    const appenniniElem = document.getElementById(`count-appennini-${regione.id}`);
                    const carabinieriElem = document.getElementById(`count-carabinieri-${regione.id}`);
                    const fanteriaElem = document.getElementById(`count-fanteria-${regione.id}`);
                    const costieraElem = document.getElementById(`count-costiera-${regione.id}`);
                    const intelligenceElem = document.getElementById(`count-intelligence-${regione.id}`);
                    const antisommossaElem = document.getElementById(`count-antisommossa-${regione.id}`);
                    const specialiElem = document.getElementById(`count-speciali-${regione.id}`);

                    if (totalElem) totalElem.textContent = totalUnita;
                    if (appenniniElem) appenniniElem.textContent = appenniniCount;
                    if (carabinieriElem) carabinieriElem.textContent = carabinieriCount;
                    if (fanteriaElem) fanteriaElem.textContent = fanteriaCount;
                    if (costieraElem) costieraElem.textContent = costieraCount;
                    if (intelligenceElem) intelligenceElem.textContent = intelligenceCount;
                    if (antisommossaElem) antisommossaElem.textContent = antisommossaCount;
                    if (specialiElem) specialiElem.textContent = specialiCount;

                    const adminElem = document.getElementById(`admin-list-${regione.id}`);
                    if (adminElem && currentUser && currentUser.uid === ADMIN_UID) {
                        if (snapshot.empty) {
                            adminElem.innerHTML = `<div class="admin-users-list">Nessuna unità schierata.</div>`;
                        } else {
                            adminElem.innerHTML = `<div class="admin-users-list"><strong>Dettaglio Comandante:</strong><br>${listaAdminHtml}</div>`;
                        }
                    }
                });
            });
        });

        // Funzione standard per utenti normali (dislocazione personale)
        window.mobilitatiIn = async function(luogoId, luogoNome) {
            if (!currentUser) {
                alert("Devi prima effettuare l'accesso!");
                return;
            }

            const reparto = document.getElementById(`reparto-${luogoId}`).value;
            const unitaVal = parseInt(document.getElementById(`num-unita-${luogoId}`).value);

            if (isNaN(unitaVal) || unitaVal < 1) {
                alert("Inserisci un numero valido di unità (almeno 1)!");
                return;
            }

            try {
                await setDoc(doc(db, "mobilitazioni", currentUser.uid + "_" + luogoId), {
                    userId: currentUser.uid,
                    nickname: currentUser.displayName || "Recluta",
                    luogoId: luogoId,
                    luogoNome: luogoNome,
                    reparto: reparto,
                    unita: unitaVal,
                    updatedAt: new Date()
                });
                alert(`Dislocati con successo ${unitaVal} unità (${reparto}) a ${luogoNome}!`);
            } catch (error) {
                alert("Errore durante la mobilitazione: " + error.message);
            }
        };

        // Funzione RINFORZI CUMULATIVI per l'Admin (Fronte)
        window.aggiungiRinforziAdmin = async function(luogoId, luogoNome) {
            if (!currentUser || currentUser.uid !== ADMIN_UID) {
                alert("Accesso non autorizzato!");
                return;
            }

            const reparto = document.getElementById(`reparto-${luogoId}`).value;
            const rinforziVal = parseInt(document.getElementById(`num-unita-${luogoId}`).value);

            if (isNaN(rinforziVal) || rinforziVal < 1) {
                alert("Inserisci un numero valido di rinforzi!");
                return;
            }

            const docId = currentUser.uid + "_" + luogoId;
            const docRef = doc(db, "mobilitazioni", docId);

            try {
                const docSnap = await getDoc(docRef);
                let unitaTotali = rinforziVal;

                if (docSnap.exists()) {
                    const datiEsistenti = docSnap.data();
                    // Se il reparto è lo stesso, somma le unità, altrimenti assegna il nuovo valore o aggiorna
                    const unitaPrec = parseInt(datiEsistenti.unita || 0);
                    unitaTotali = unitaPrec + rinforziVal;
                }

                await setDoc(docRef, {
                    userId: currentUser.uid,
                    nickname: currentUser.displayName || "Fronte ★",
                    luogoId: luogoId,
                    luogoNome: luogoNome,
                    reparto: reparto,
                    unita: unitaTotali,
                    updatedAt: new Date()
                });

                alert(`Aggiunti ${rinforziVal} rinforzi (${reparto}) a ${luogoNome}! Totale truppe Fronte qui: ${unitaTotali}`);
            } catch (error) {
                alert("Errore nell'invio dei rinforzi: " + error.message);
            }
        };

        // Funzione per ritirare/rimuovere le proprie truppe
        window.rimuoviUnita = async function(luogoId) {
            if (!currentUser) {
                alert("Devi prima effettuare l'accesso!");
                return;
            }

            if (!confirm("Confermi di voler ritirare le tue truppe da questo settore?")) {
                return;
            }

            try {
                await deleteDoc(doc(db, "mobilitazioni", currentUser.uid + "_" + luogoId));
                alert("Truppe ritirate con successo.");
                map.closePopup();
            } catch (error) {
                alert("Errore durante il ritiro delle truppe: " + error.message);
            }
        };
    </script>
</body>
</html>
