<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mappa della Brigata - Brigata Appennina ★</title>
    <link rel="icon" type="image/png" href="sfondoba.png">
    
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            color: #ffffff;
            background-color: #0b1a0e;
            position: relative;
            overflow: hidden;
        }

        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('sfondoba.png');
            background-size: cover;
            background-position: center;
            filter: blur(8px) opacity(0.3);
            transform: scale(1.05);
            z-index: -1;
        }

        header {
            background: rgba(15, 35, 20, 0.9);
            border-bottom: 2px solid #008c45;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
            backdrop-filter: blur(5px);
        }

        header h1 {
            font-size: 1.4em;
            color: #ffffff;
        }

        .back-btn {
            background-color: #008c45;
            color: white;
            padding: 8px 15px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.9em;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background-color: #00b359;
        }

        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }

        /* Stile personalizzato per i Popup di Leaflet */
        .leaflet-popup-content-wrapper {
            background-color: rgba(15, 35, 20, 0.95);
            color: #fff;
            border-radius: 12px;
            border: 2px solid #008c45;
            backdrop-filter: blur(5px);
            text-align: center;
        }

        .leaflet-popup-tip {
            background-color: #008c45;
        }

        .popup-title {
            font-size: 1.1em;
            font-weight: bold;
            color: #00b359;
            margin-bottom: 6px;
        }

        .popup-desc {
            font-size: 0.85em;
            line-height: 1.4;
            color: #d1d5db;
            margin-bottom: 10px;
        }

        .popup-images {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 5px;
            flex-wrap: wrap;
        }

        .popup-img {
            width: 90px;
            height: 65px;
            object-fit: cover;
            border-radius: 6px;
            border: 1px solid #ffffff;
        }
    </style>
</head>
<body>

        <a href="index.html" class="back-btn">← Home</a>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

            zoomControl: false
        }).setView([42.5, 12.5], 6);

        L.control.zoom({ position: 'topright' }).addTo(map);

            maxZoom: 18,
            attribution: '© OpenStreetMap contributors'
        }).addTo(map);

        // Caricamento e colorazione dei confini dell'Italia
        fetch('https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_national.geojson')
            .then(res => res.json())
            .then(data => {
                L.geoJSON(data, {
                    style: {
                        fillColor: '#008c45',
                        fillOpacity: 0.35,
                        color: '#00b359',
                        weight: 2
                    }
                }).addTo(map);
            });
