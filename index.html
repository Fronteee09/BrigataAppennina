<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brigata Appennina ★</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="sfondoba.png">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #ffffff;
            background-color: #0b1a0e;
            position: relative;
            overflow-x: hidden;
            padding: 20px;
        }

        /* Sfondo personalizzato sfocato e opacizzato */
        .bg-image {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('sfondoba.png');
            background-size: cover;
            background-position: center;
            filter: blur(8px) opacity(0.3);
            transform: scale(1.05);
            z-index: -1;
        }

        /* Box Centrale */
        .card-container {
            background: rgba(15, 35, 20, 0.85);
            border: 2px solid #008c45;
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 100%;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
        }

        /* Logo */
        .logo {
            width: 130px;
            height: 130px;
            border-radius: 25px;
            object-fit: cover;
            border: 3px solid #ffffff;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
        }

        h1 {
            font-size: 2em;
            color: #ffffff;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p.description {
            font-size: 1em;
            color: #d1d5db;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        /* Pulsanti */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            border-radius: 12px;
            font-size: 1em;
            font-weight: bold;
            text-decoration: none;
            transition: all 0.2s ease-in-out;
            cursor: pointer;
        }

        .btn-primary {
            background-color: #008c45;
            color: #ffffff;
            border: none;
        }

        .btn-primary:hover {
            background-color: #00b359;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background-color: transparent;
            color: #ffffff;
            border: 2px solid #cd212a;
        }

        .btn-secondary:hover {
            background-color: #cd212a;
            transform: translateY(-2px);
        }

        .btn-accent {
            background-color: #1f2937;
            color: #ffffff;
            border: 2px solid #008c45;
        }

        .btn-accent:hover {
            background-color: #374151;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .card-container {
                padding: 30px 20px;
            }
            h1 {
                font-size: 1.6em;
            }
        }
    </style>
</head>
<body>

    <div class="bg-image"></div>

    <div class="card-container">
        <img src="sfondoba.png" alt="Brigata Appennina Logo" class="logo">
        
        <h1>Brigata Appennina ★</h1>
        <p class="description">
            La community ufficiale per la difesa del meme risorgimentale, dei borghi arroccati e della storia d'Italia. Capitale ufficiale: Scanno.<br><br>
            <b>Benvenute, reclute!</b>
        </p>

        <div class="btn-group">
            <a href="mappa.html" class="btn btn-primary">🗺️ Visualizza la Mappa</a>
            <a href="annunci.html" class="btn btn-accent">📢 Visualizza Annunci</a>
            <a href="pagine.html" class="btn btn-accent">📄 Visualizza Pagine</a>
            <a href="account.html" class="btn btn-secondary">👤 Account / Login</a>
        </div>
    </div>

</body>
</html>
